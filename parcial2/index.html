<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Salteñeria El Horno</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header>
        <h1>Salteñeria El Horno</h1>
    </header>
    <main>
        <div class="imagen">
            <img src="img/salteña.jpg" alt="foto de Salteña">
        </div>
        <p>Las mejores salteñas tradicionales de Quillacollo.</p>
        <form id="form-horno" novalidate method="POST" action="procesar.php">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="correo">Correo electronico</label>
            <input type="email" id="correo" name="correo" required>

            <label for="pedido">Que salteñas queres</label>
            <textarea id="pedido" name="pedido"></textarea>

            <button type="submit">Hacer mi pedido</button>

            <p id="aviso-horno" class="aviso"></p>
        </form>
    </main>
    <footer>
        <p>&copy;Parcial 2 - Choque Candia Nicolas - 20 de octubre de 2026</p>
    </footer>
    <script src="script.js" defer></script>

</html>
